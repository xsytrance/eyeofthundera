name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Tests
        run: pytest -q

      - name: Configs still valid
        run: |
          thundera check -c examples/undertale-vera.toml
          thundera check -c examples/fft-psx-vera.toml

  no-deps:
    # The core must keep working with nothing installed — the http engine is
    # the promise that this tool runs on a bare box.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with no extras
        run: pip install -e . && pip install pytest
      - name: Non-browser tests must pass
        run: pytest -q tests/test_config.py tests/test_findings.py tests/test_end_to_end.py
      - name: CLI works without Playwright
        run: thundera --version && thundera init /tmp/t.toml --base http://127.0.0.1:1
