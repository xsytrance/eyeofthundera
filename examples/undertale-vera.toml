# ── save-gated views ────────────────────────────────────────────────────────
# Unreachable before 2026-07-30: they need the `with-save` profile above.

[[surfaces]]
key = "council"
path = "/"
group = "save"
settle_ms = 1500
setup = [
  { click = "?#save-pill" },
  { click = '[data-view="council"]' },
  # The view's own container. A bare click "succeeds" even when the app
  # redirects to `saves`, so this is what makes reaching the view verifiable.
  { wait_for = "#view-council" },
]

