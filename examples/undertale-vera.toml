# ── API surfaces ─────────────────────────────────────────────────────────────
# Carried over from the vendored inspector's SURFACES list so the migration
# loses no coverage. These are status-code checks: a JSON document has no
# layout, so the visual checks find nothing on them by construction.
#
# The old inspector also probed REQUIRED_ASSETS (determination.css, app.js,
# music.js) over HTTP. That list is deliberately NOT carried over: the browser
# engine records every request the real page makes, so a missing stylesheet or
# script now surfaces as a `network` finding on `chat` — the same guarantee
# without a hand-maintained list that drifts out of date.

[[surfaces]]
key = "api-health"
path = "/api/health"
group = "api"
settle_ms = 400

[[surfaces]]
key = "api-characters"
path = "/api/characters"
group = "api"
settle_ms = 400

[[surfaces]]
key = "api-projects"
path = "/api/projects"
group = "api"
settle_ms = 400

[[surfaces]]
key = "api-lore"
path = "/api/lore?q=waterfall"
group = "api"
settle_ms = 400

[network]
# The frontend smoke deliberately posts a bad watch path (expected 400).
# Google Fonts is an external CDN: the CSS ships serif fallbacks, so a failure
# to reach it is an environment condition, not an app defect.
ignore = ["favicon", "/api/guided/watch", "fonts.googleapis", "fonts.gstatic"]

[vision]
sample = ["chat", "soundtest"]
