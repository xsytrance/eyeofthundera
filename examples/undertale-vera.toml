# undertale-vera — the reference config, and the project's first real consumer.
#
# This file is committed at that repo's root as `thundera.toml`; this copy is
# kept in sync as a worked example. Run it with the app up on :9092:
#
#   thundera look -c examples/undertale-vera.toml
#   thundera look -c examples/undertale-vera.toml --engine http
#
# undertale-vera is a single-page app with NO url routing: every view is
# reached by clicking a nav button, so each UI surface is the same path ("/")
# plus the click that reveals it.
#
# Views marked NEEDS_SAVE in app.js (council, timeline, journal, constellation,
# chronicle, judgment, reports) bounce to the saves view unless a save has been
# read. As of 2026-07-30 they ARE listed: the `with-save` profile uploads a
# synthetic save once per browser context, which is what unlocks them.

[app]
name = "undertale-vera"
base = "http://127.0.0.1:9092"
routing = "path"
# Required by the `with-save` profile below. The app holds a loaded save in
# memory only — nothing in localStorage — so a reload between surfaces throws
# it away and the seven gated views bounce back to `saves`. Every surface here
# is the same URL ("/"), so reusing the page costs nothing and is what makes
# the upload stick. See docs/ARCHITECTURE.md for the isolation trade-off.
navigate = "once"

# Skip the first-run power picker and the one-shot per-view explainer modals —
# otherwise every screenshot is a picture of a modal.
[seeds]
uv_power_seen = "1"
uv_seen_council = "1"
uv_seen_timeline = "1"
uv_seen_journal = "1"
uv_seen_constellation = "1"
uv_seen_chronicle = "1"
uv_seen_judgment = "1"
uv_seen_reports = "1"
uv_seen_soundtest = "1"
uv_seen_workshop = "1"
uv_seen_guided = "1"
uv_seen_multivera = "1"
uv_seen_howitworks = "1"
uv_seen_credits = "1"
uv_seen_commons = "1"

# ── the save precondition ────────────────────────────────────────────────────
# Seven views are gated behind "has a save been read?", which no localStorage
# seed can answer — the app wants an actual file. This runs once per browser
# context, before any surface, and everything after it inherits the loaded save.
#
# The fixtures are synthetic (see examples/fixtures/README.md). The selectors
# are the same ones undertale-vera's own frontend_smoke.py drives, which is the
# best evidence they are the supported way in.

[[profiles]]
name = "with-save"
setup = [
  # At 390px the nav lives in a slide-in drawer and #add-save-btn is not
  # reachable until #save-pill opens it. On desktop the pill does not exist,
  # hence "?". Without this the upload fails at mobile only — which is exactly
  # what the first run of this config reported, on all 20 surfaces.
  { click = "?#save-pill" },
  { click = "#add-save-btn" },
  { upload = { selector = "#file0-input", path = "fixtures/file0_pacifist" } },
  { upload = { selector = "#ini-input", path = "fixtures/undertale_pacifist.ini" } },
  { click = "#upload-btn" },
  # Proof the save actually parsed. Without this the sweep would happily
  # measure seven copies of the saves view and call them clean — which is
  # exactly what happened the first time this was attempted.
  { wait_for = "#route-badge" },
]

# ── UI surfaces ──────────────────────────────────────────────────────────────

[[surfaces]]
key = "chat"
path = "/"
group = "core"
settle_ms = 2500
inventory = { cast = ".chat-empty-cast", brand = ".brand-name" }
# Under navigate = "once" the page is not reloaded, so it arrives showing
# whatever the previous surface left on screen. Every surface therefore has to
# select its own view explicitly — chat included, even though a fresh load
# would have opened here by default. This is the cost of page reuse, and it is
# why "once" is opt-in.
setup = [{ click = '?#save-pill' }, { click = '[data-view="chat"]' }]

[[surfaces]]
key = "saves"
path = "/"
group = "core"
settle_ms = 1200
# On mobile the nav lives in a slide-in drawer: #save-pill opens it, and it
# does not exist as a click target on desktop — hence the optional "?" prefix.
# The saves view has no [data-view] nav button — the rail's "Read a save"
# button is what opens it. (Guessing the selector here is how you get a
# pre_click_failed finding, which is the point: the Eye refuses to call a
# surface clean when it never actually got there.)
setup = [
  { click = "?#save-pill" },
  { click = "#add-save-btn" },
  { wait_for = "#view-saves" },
]

[[surfaces]]
key = "howitworks"
path = "/"
group = "info"
settle_ms = 1200
setup = [
  { click = "?#save-pill" },
  { click = '[data-view="howitworks"]' },
  { wait_for = "#view-howitworks" },
]

[[surfaces]]
key = "multivera"
path = "/"
group = "info"
settle_ms = 1200
setup = [
  { click = "?#save-pill" },
  { click = '[data-view="multivera"]' },
  { wait_for = "#view-multivera" },
]

[[surfaces]]
